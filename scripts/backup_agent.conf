# ==============================================================================
# BackupPulse Client Configuration File (/etc/backup_agent.conf)
# ==============================================================================
# Place this file on client servers or export these environment variables.

# BackupPulse Central Ingestion Hub
API_URL="http://your-backup-hub.internal:3000/api/v1/backups/report"
API_KEY="bkp_live_secret_key_12345"

# S3 Destination Vault Settings
S3_BUCKET="company-production-backups"
S3_PREFIX="servers"
AWS_DEFAULT_REGION="us-east-1"

# S3 Access Key & Secret Key Authentication
# (Leave blank to automatically use AWS IAM Role / Instance Profile or ~/.aws/credentials)
AWS_ACCESS_KEY_ID=""
AWS_SECRET_ACCESS_KEY=""
# Note: The aliases S3_ACCESS_KEY and S3_SECRET_KEY are also supported

# Optional Custom S3 Endpoint (for MinIO, Wasabi, Cloudflare R2, DigitalOcean Spaces)
# S3_ENDPOINT_URL="https://s3.wasabisys.com"

ENVIRONMENT="production"
KEEP_LOCAL_DAYS=0
TEMP_DIR="/tmp/backup_jobs"

