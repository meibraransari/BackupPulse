global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ==============================================================================
  # BackupPulse Central Monitoring Hub Telemetry Scraper
  # ==============================================================================
  - job_name: 'backuppulse-hub'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['app:3000']
        labels:
          environment: 'production'
          service: 'backuppulse-hub'
          system: 'central-backup-telemetry'
