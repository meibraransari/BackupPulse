apiVersion: 1

providers:
  - name: 'BackupPulse Dashboards'
    orgId: 1
    folder: 'BackupPulse Telemetry'
    folderUid: 'backuppulse-folder'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
