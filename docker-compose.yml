services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: backup-pulse-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-backup_monitor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      backup-network:
        aliases:
          - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # BackupPulse Application (Backend API + Frontend Dashboard in Single Container)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backup-pulse-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ENABLE_CONSOLE_LOG: ${ENABLE_CONSOLE_LOG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_123}@postgres:5432/${POSTGRES_DB:-backup_monitor_db}?schema=public}
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_please_change_me_super_secure_987654321}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-bkp_live_secret_key_12345}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@123456}
      REPORT_CRON: ${REPORT_CRON:-0 9 * * *}
      INSTANT_ALERT_ON_FAILURE: ${INSTANT_ALERT_ON_FAILURE:-true}
      ENABLE_GOOGLE_CHAT: ${ENABLE_GOOGLE_CHAT:-true}
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      ENABLE_SLACK: ${ENABLE_SLACK:-false}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ENABLE_DISCORD: ${ENABLE_DISCORD:-false}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ENABLE_TELEGRAM: ${ENABLE_TELEGRAM:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ENABLE_SMTP: ${ENABLE_SMTP:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-BackupPulse Central <alerts@backup-pulse.internal>}
      SMTP_TO: ${SMTP_TO:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM: ${SENDGRID_FROM:-}
      AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:-}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:-}
      AWS_SES_FROM: ${AWS_SES_FROM:-}
      DB_RETENTION_DAYS: ${DB_RETENTION_DAYS:-365}
      ENABLE_HOUSEKEEPING: ${ENABLE_HOUSEKEEPING:-true}
      HOUSEKEEPING_CRON: ${HOUSEKEEPING_CRON:-0 3 * * *}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backup-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  backup-network:
    driver: bridge
